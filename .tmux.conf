bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================================
# Modern & Elegant Tmux Configuration
# ==============================================================================

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Clipboard integration (failsafe using xclip if available)
if-shell "command -v xclip >/dev/null 2>&1" \
  "bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'" \
  "bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel"

# Increase scrollback buffer size
set -g history-limit 50000

# Increase tmux messages display time
set -g display-time 4000

# Refresh status line more often (every 5 seconds)
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful window/pane index settings (start at 1 instead of 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Snappy escape time (prevents Vim/Neovim escape key delay)
set -sg escape-time 10

# ------------------------------------------------------------------------------
# Key Bindings
# ------------------------------------------------------------------------------
# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using | and - (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ------------------------------------------------------------------------------
# Theme & Styling (Catppuccin Mocha Style)
# ------------------------------------------------------------------------------

# --- Icon and Separator Configuration (Failsafe System) ---
# If your terminal DOES NOT support Nerd Fonts (showing boxes or question marks),
# comment out the "Nerd Fonts Style" block and uncomment the "Failsafe Style" block below.

# Options [A]: Nerd Fonts Style (Default)
set -g @left_sep ""
set -g @right_sep ""
set -g @icon_session "󰇄 "
set -g @icon_path "󰉋 "
set -g @icon_date "󰃭 "
set -g @icon_time "󱑎 "

# Options [B]: Failsafe Style (Standard Unicode - Works everywhere)
# set -g @left_sep " "
# set -g @right_sep " "
# set -g @icon_session "● "
# set -g @icon_path "■ "
# set -g @icon_date "◆ "
# set -g @icon_time "▲ "

# Status bar general settings
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"

# Double status bar to draw a separator line between panes and the status bar
set -g status 2
set -g status-format[0] "#[fg=#45475a,bg=default]#(yes ─ | head -n 300 | tr -d '\n')"
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"


# Left status: Session name (changes color to yellow when prefix is pressed)
set -g status-left-length 50
set -g status-left "#{?client_prefix,#[fg=#181825 bg=#f9e2af bold] #{@icon_session}#S #[fg=#f9e2af bg=default nobold]#{@right_sep},#[fg=#181825 bg=#a6e3a1 bold] #{@icon_session}#S #[fg=#a6e3a1 bg=default nobold]#{@right_sep}} "

# Window list formatting
setw -g window-status-separator " "

# Inactive window style: clean text
setw -g window-status-format "#[fg=#585b70,bg=default] #I #W "

# Active window style: rounded pill
setw -g window-status-current-format "#[fg=#cba6f7,bg=default]#{@left_sep}#[fg=#181825,bg=#cba6f7,bold] #I #W #[fg=#cba6f7,bg=default]#{@right_sep}"

# Right status: Date, Time, and Weather/Notification (as rounded pills)
set -g status-right-length 250
set -g status-right "#(bash /home/qlo/dotfiles/scripts/tmux_extra_info.sh #{client_width})#[fg=#89b4fa,bg=default]#{@left_sep}#[fg=#181825,bg=#89b4fa,bold]#{@icon_date}%Y-%m-%d #[fg=#181825,bg=#a6e3a1,bold] #{@icon_time}%H:%M#[fg=#a6e3a1,bg=default]#{@right_sep}"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#cba6f7 bg=default]#{@left_sep}#[fg=#181825 bg=#cba6f7 bold] #I #{pane_current_command} #[fg=#fab387 bg=#313244 bold] #{@icon_path}#{b:pane_current_path} #[fg=#313244 bg=default]#{@right_sep},#[fg=#45475a bg=default]#{@left_sep}#[fg=#a6adc8 bg=#45475a] #I #{pane_current_command} #[fg=#bac2de bg=#313244] #{@icon_path}#{b:pane_current_path} #[fg=#313244 bg=default]#{@right_sep}}"

# Command prompt / message style
set -g message-style "fg=#89dceb,bg=#313244,align=centre"
set -g message-command-style "fg=#89dceb,bg=#313244,align=centre"

# Pane number indicator (prefix + q)
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#313244"

# Clock mode (prefix + t)
setw -g clock-mode-colour "#89b4fa"

# Copy mode selection highlight style
setw -g mode-style "fg=#f5c2e7 bg=#585b70 bold"

# ==============================================================================
# Background Services
# ==============================================================================
# Run background daemon for weather and notifications
run-shell -b "python3 /home/qlo/dotfiles/scripts/tmux_daemon.py"


